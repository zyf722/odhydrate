name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Check and build Windows amd64
        run: go run ./tools/build build

      - uses: actions/upload-artifact@v4
        with:
          name: odhydrate-windows-amd64
          path: dist/odhydrate.exe
