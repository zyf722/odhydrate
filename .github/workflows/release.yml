name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic-version tag to create (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build release archive
        run: go run ./tools/build release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./tools/build publish
